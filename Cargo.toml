[package]
name = "dnsmasq-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["dhcp", "dhcp6", "dnssec", "auth", "tftp", "loop", "inotify", "dump", "bpf"]
dhcp     = []
dhcp6    = ["dhcp"]
dnssec   = []
auth     = []
tftp     = []
loop     = []
inotify  = []
dump     = []
bpf      = []
conntrack = []
dbus     = ["dep:zbus"]
ubus     = []
ipset    = []
nftset   = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Byte buffers
bytes = "1"

# LRU cache
lru = "0.12"

# Random number generation
rand = "0.8"

# System / networking
nix = { version = "0.29", features = ["net", "socket", "signal", "process", "user", "fs"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
libc = "0.2"

# Crypto (DNSSEC)
ring = { version = "0.17", optional = false }
rsa = { version = "0.9", features = ["sha2"], optional = false }
sha2 = "0.10"
p256 = { version = "0.13", optional = false }
p384 = { version = "0.13", optional = false }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = false }

# D-Bus (optional)
zbus = { version = "4", optional = true }

# Linux capabilities
caps = "0.5"

[dev-dependencies]
proptest = "1"