[package]
name = "dnsmasq-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["dhcp", "dhcp6", "auth", "tftp", "loop", "inotify", "dump", "ipset", "script", "legacy-config"]
dhcp     = []
dhcp6    = ["dhcp"]
dnssec   = []
auth     = []
tftp     = []
loop     = []
inotify  = []
dump     = []
conntrack = []
dbus     = ["dep:zbus"]
ubus     = []
ipset    = []
nftset   = []
script   = []
# The original dnsmasq key=value conf-file format. On by default so existing
# configs keep working unchanged; a build can drop it to accept only YAML.
legacy-config = []
# YAML conf-file support (`--conf-file=*.yaml`/`*.yml`) plus the
# --convert-config legacy-to-YAML migration flag. Off by default until proven.
yaml-config = ["dep:serde", "dep:serde_norway"]
# Read-only HTTP status/diagnostics API (`--web-api-listen=<addr:port>`).
# Off by default. See issue #165; no authentication yet (issue #166).
web-api = ["dep:axum", "dep:serde", "dep:serde_json", "dep:tower"]
# Self-hosted server-rendered web UI (htmx) layered on web-api. See #167.
web-ui = ["web-api"]
# `--log-facility=journald`: a hand-rolled native journald client (no
# tracing-journald dependency, to keep one logging-integration pattern).
# Linux-only. Off by default. See issue #172.
journald = []
# Prometheus-compatible `/metrics` HTTP endpoint (`--metrics-listen=<addr:port>`).
# Standalone from `web-api`/`web-ui` by design. Off by default. See issue #173.
metrics-api = ["dep:axum", "dep:tower"]

[lib]
name = "dnsmasq_rs"
path = "src/lib.rs"

[[bin]]
name = "dnsmasq-rs"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Byte buffers
bytes = "1"

# Typed bitmask flag sets
bitflags = "2"

# LRU cache
lru = "0.12"

# Random number generation
rand = "0.8"

# System / networking
nix = { version = "0.29", features = ["net", "socket", "signal", "process", "user", "fs", "dir"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
libc = "0.2"

# Crypto (DNSSEC)
ring = { version = "0.17", optional = false }
rsa = { version = "0.9", features = ["sha2"], optional = false }
sha2 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", optional = false }
p384 = { version = "0.13", optional = false }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = false }

# D-Bus (optional)
zbus = { version = "4", optional = true }

# Linux capabilities
caps = "0.5"

tempfile = "3"
proptest = "1"

# YAML config support (optional, see the yaml-config feature)
serde = { version = "1", features = ["derive"], optional = true }
serde_norway = { version = "0.9", optional = true }

# Web API support (optional, see the web-api feature)
axum = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }