no-daemon
no-resolv
no-hosts
port=1053
local-ttl=120

host-record=real.test,192.0.2.50,60

# A 3-hop CNAME chain terminating on real.test's A record - both daemons
# must resolve the full chain and return every CNAME plus the final address
# record in the answer section.
cname=hop1.test,hop2.test,60
cname=hop2.test,hop3.test,60
cname=hop3.test,real.test,60

# A 1-hop CNAME to a name with no data at all - queries against it should
# return the CNAME and nothing else (NODATA past the alias).
cname=dead-end.test,nowhere.test,60
