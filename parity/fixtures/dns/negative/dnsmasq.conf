no-daemon
no-resolv
no-hosts
port=1053
local-ttl=60

# Deliberately minimal local data: every query in queries.txt targets a name
# not covered by this config, so both daemons must independently construct
# the same negative (NXDOMAIN) reply shape - rcode, empty answer section,
# and whatever authority/additional content each includes - with nothing to
# forward to (no-resolv) and no static data to fall back on (no-hosts).
host-record=known.test,192.0.2.1,60
