no-daemon
no-resolv
no-hosts
port=1053
local-ttl=60

# --address=/domain/ip: answer with a fixed address for domain + subdomains,
# never forwarded.
address=/blocked.test/198.51.100.7

# --address=/domain/# : NULL address (0.0.0.0 / ::) for domain + subdomains -
# syntactic sugar for address=/domain/0.0.0.0 plus address=/domain/::.
address=/nulled.test/#

# --address=/domain/ with no address, and --server=/domain/ with no address:
# both mean "never forward, answer NXDOMAIN" for domain + subdomains.
address=/blank.test/
server=/serverblock.test/

# --address=/#/ip: catch-all wildcard - matches any query not answered from
# static data (host-record/hosts/DHCP) and not sent upstream by a more
# specific --server directive.
address=/#/203.0.113.9

# A specific host-record must still win over the /#/ wildcard above.
host-record=allowed.test,192.0.2.20,60

# A subdomain of a blocked domain must inherit the same block.
